name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/carwash
          NEXTAUTH_SECRET: ci-only-secret-not-used-outside-build
          NEXTAUTH_URL: http://localhost:3000
          MOBILE_API_SECRET: ci-only-mobile-secret
